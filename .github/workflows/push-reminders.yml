name: Push reminders

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
    steps:
      - name: Send daily reminders
        if: env.PUSH_CRON_SECRET != ''
        run: |
          curl -sS --fail-with-body -X POST "https://zhwqqcewxccwjhtdkvck.supabase.co/functions/v1/send-reminders" \
            -H "content-type: application/json" \
            -H "x-cron-secret: $PUSH_CRON_SECRET" \
            -d '{"test": false}'

name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Ensure Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          TOOLS=$(ls -d $SDK/cmdline-tools/*/bin | head -1)
          yes | "$TOOLS/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$TOOLS/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
      - run: npm run build -w app
        env:
          VITE_SUPABASE_URL: https://zhwqqcewxccjhtdkvck.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: npx cap sync android
        working-directory: app
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: app/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: runcast-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

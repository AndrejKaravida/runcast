name: Admin create test user

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create test@test.com via SQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare uid uuid;
          begin
            if exists (select 1 from auth.users where email = 'test@test.com') then
              raise notice 'user already exists';
              return;
            end if;
            uid := gen_random_uuid();
            insert into auth.users (
              id, instance_id, aud, role, email, encrypted_password, email_confirmed_at,
              raw_app_meta_data, raw_user_meta_data,
              confirmation_token, recovery_token, email_change, email_change_token_new,
              email_change_token_current, phone_change, phone_change_token, reauthentication_token,
              created_at, updated_at
            ) values (
              uid, '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated',
              'test@test.com', '$2a$10$5IdZ1ca2Q1CjRICTOf5er.wtqF6QaPDSKUkGw1tx6.CbrHv11U09G', now(),
              '{"provider":"email","providers":["email"]}'::jsonb,
              jsonb_build_object('sub', uid::text, 'email', 'test@test.com', 'display_name', 'Test Korisnik', 'email_verified', true, 'phone_verified', false),
              '', '', '', '', '', '', '', '',
              now(), now()
            );
            insert into auth.identities (id, user_id, provider, provider_id, identity_data, last_sign_in_at, created_at, updated_at)
            values (gen_random_uuid(), uid, 'email', uid::text,
              jsonb_build_object('sub', uid::text, 'email', 'test@test.com', 'email_verified', true, 'phone_verified', false),
              now(), now(), now());
            raise notice 'created %', uid;
          end $$;
          select email, email_confirmed_at is not null as confirmed from auth.users where email = 'test@test.com';
          SQL
